services:
  devtools-rts-mk1-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devtools-rts-mk1-web:v1.2.0
    container_name: devtools-rts-mk1-web
    restart: unless-stopped
    user: "node"
    environment:
      - NODE_ENV=production
      - APP_VERSION=1.2.0
      - PORT=4310
      - WEB_PORT=4310
      - PROJECT_NAME=DEVTOOLS-RTS-MK1
      - PUBLIC_DNS_DOMAIN=devtools-rts-mk1.orbital8.cloud
      - NEXT_PUBLIC_APP_URL=https://devtools-rts-mk1.orbital8.cloud
      - RTS_DB_PATH=/app/data/rts-mk1.sqlite
    volumes:
      - default_rts_mk1_data:/app/data
    expose:
      - "4310"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - ai-network

volumes:
  default_rts_mk1_data:
    external: true

networks:
  ai-network:
    external: true
